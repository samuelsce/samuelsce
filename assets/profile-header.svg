<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Samuel Santos Cerqueira — Desenvolvimento Front-End</title>
  <desc id="desc">Banner azul profundo com detalhes ciano e violeta. Interfaces que conectam ideia e experiência. Composição abstrata de janelas e conexões à direita.</desc>
