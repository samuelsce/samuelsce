name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23f59e0b&color_dots=%23ebedf0,%23fef3c7,%23fcd34d,%23f59e0b,%23d97706
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23f59e0b&color_dots=%2311161f,%2327303d,%239a6700,%23d97706,%23f59e0b

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

